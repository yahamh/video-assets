name: Make videos

# Voices and renders every story in stories/ that has no video yet, and publishes each one as a release
# named after the story (the MP4 and the voiced JSON), where posting picks it up.
# Runs when stories are added to the "stories" branch (this repo's main branch holds other videos and is left alone).
on:
  push:
    branches: [stories]
    paths: [stories/**]
  workflow_dispatch:

concurrency:
  group: make
  cancel-in-progress: false

permissions:
  contents: write

env:
  PER_RUN: "9"

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Stories without a video
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq -r .default voices.json)" = null ]; then echo "No voice picked yet in voices.json"; exit 0; fi
          made=$(gh release list --limit 2000 --json tagName --jq '.[].tagName')
          todo=""
          for f in $(ls stories/*.json | sort); do
            id=$(basename "$f" .json)
            grep -qx "$id" <<<"$made" || todo="$todo $f"
          done
          todo=$(echo $todo | tr ' ' '\n' | head -n "$PER_RUN" | tr '\n' ' ')
          echo "stories=$todo" >> "$GITHUB_OUTPUT"
          echo "To make: ${todo:-nothing}"
      - if: steps.todo.outputs.stories != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.todo.outputs.stories != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: steps.todo.outputs.stories != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('requirements.txt') }}
      - name: Tools
        if: steps.todo.outputs.stories != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          npm ci
      - name: Music
        if: steps.todo.outputs.stories != ''
        run: |
          for story in ${{ steps.todo.outputs.stories }}; do
            m=$(jq -r '.music // empty' "$story"); n=$(jq -r .number "$story")
            [ -n "$m" ] && [ ! -f "public/$m" ] && python scripts/music.py "public/$m" 45 "$n"
          done; true
      - name: Reference voices
        if: steps.todo.outputs.stories != ''
        run: scripts/refs.sh
      - name: Voice, render and publish
        if: steps.todo.outputs.stories != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          failed=0
          for story in ${{ steps.todo.outputs.stories }}; do
            id=$(jq -r .id "$story")
            echo "::group::$id"
            if python3 scripts/check.py "$story" \
              && python scripts/voice.py "$story" --out "out/$id.json" \
              && node scripts/render.mjs "out/$id.json" "out/$id.mp4"; then
              gh release create "$id" "out/$id.mp4" "out/$id.json" \
                --title "$(jq -r '"\(.number). \(.title)"' "$story")" \
                --notes "$(jq -r '.post.caption' "$story")"
            else
              echo "::error::$id failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
