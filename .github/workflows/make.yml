name: Make videos

# Voices and renders every story in stories/ and every render lesson in lessons/ that has no video yet, and
# publishes each one as a release named after it (the MP4 and the voiced JSON). Then scripts/post.py books every
# finished video that isn't booked yet in Zernio (schedule.json: three stories a day, one lesson a day on YouTube,
# and the videos made elsewhere in uploads/ at their own times), and posts.json records it.
# Runs when stories are added to the "stories" branch (this repo's main branch holds other videos and is left alone).
# To make a story again (after a change to the voice or the look), put its id in remake.txt and push: the run
# deletes that video, makes it again and empties remake.txt. Started by hand, "remake" does the same.
on:
  push:
    branches: [stories]
    paths: [stories/**, lessons/**, uploads/**, remake.txt, schedule.json, scripts/post.py]
  workflow_dispatch:
    inputs:
      remake:
        description: "Story or lesson ids to make again, like 001-cullinan"
        required: false
        default: ""

concurrency:
  group: make
  cancel-in-progress: false

permissions:
  contents: write

env:
  PER_RUN: "9"

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Stories without a video
        id: todo
        env:
          GH_TOKEN: ${{ github.token }}
          REMAKE: ${{ inputs.remake }}
        run: |
          if [ "$(jq -r .default voices.json)" = null ]; then echo "No voice picked yet in voices.json"; exit 0; fi
          remake=$(echo $REMAKE $(grep -v '^#' remake.txt 2>/dev/null))
          for id in $remake; do
            [[ "$id" =~ ^(lesson-)?[0-9]{3,4}-[a-z0-9-]+$ ]] || { echo "::error::not a story or lesson id: $id"; exit 1; }
            gh release delete "$id" --yes --cleanup-tag || true
          done
          echo "remake=$remake" >> "$GITHUB_OUTPUT"
          made=$(gh release list --limit 2000 --json tagName --jq '.[].tagName')
          todo=""
          for f in $(ls stories/*.json lessons/*.json 2>/dev/null | sort); do
            id=$(basename "$f" .json)
            grep -qx "$id" <<<"$made" || todo="$todo $f"
          done
          todo=$(echo $todo | tr ' ' '\n' | head -n "$PER_RUN" | xargs)  # empty when there's nothing to make
          echo "stories=$todo" >> "$GITHUB_OUTPUT"
          echo "To make: ${todo:-nothing}"
      - if: steps.todo.outputs.stories != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: steps.todo.outputs.stories != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: steps.todo.outputs.stories != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: models-${{ hashFiles('requirements.txt') }}
      - name: Tools
        if: steps.todo.outputs.stories != ''
        # 11 Nov 2026: runs 71 and 72 sat in apt for 69 and 25 minutes while Ubuntu's Azure mirror
        # (azure.archive.ubuntu.com) did not answer, and made nothing. The Azure mirror is swapped for
        # archive.ubuntu.com, each apt call gets its own time limit and three tries, and the step as a
        # whole stops after 25 minutes, so a stall can't hold the queue and the next push starts a fresh run.
        timeout-minutes: 25
        run: |
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo timeout 120 apt-get $APT update -q \
              && sudo timeout 300 apt-get $APT install -y -q ffmpeg && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r requirements.txt
          npm ci
      - name: Music
        if: steps.todo.outputs.stories != ''
        run: |
          for story in ${{ steps.todo.outputs.stories }}; do
            # a lesson's music gets its own seed, so it never repeats a story's
            m=$(jq -r '.music // empty' "$story"); n=$(jq -r '.number + (if .series == "lesson" then 500 else 0 end)' "$story")
            # the paper look gets the bright, major-key music
            b=$(jq -r 'if .style == "paper" then "bright" else "" end' "$story")
            [ -n "$m" ] && [ ! -f "public/$m" ] && python scripts/music.py "public/$m" 45 "$n" $b
          done; true
      - name: Reference voices
        if: steps.todo.outputs.stories != ''
        run: scripts/refs.sh
      - name: Voice, render and publish
        if: steps.todo.outputs.stories != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          failed=0
          for story in ${{ steps.todo.outputs.stories }}; do
            id=$(jq -r .id "$story")
            echo "::group::$id"
            if python3 scripts/check.py "$story" \
              && python scripts/voice.py "$story" --out "out/$id.json" \
              && node scripts/render.mjs "out/$id.json" "out/$id.mp4"; then
              # GitHub now and then answers a release upload with a 500 (run 46, 5 Nov 2026): that used to stop the
              # whole loop, so the rest of the batch was never made. Try three times, then go on to the next one.
              published=""
              for attempt in 1 2 3; do
                if gh release create "$id" "out/$id.mp4" "out/$id.json" \
                  --title "$(jq -r 'if .series == "lesson" then "Lesson \(.number). \(.title)" else "\(.number). \(.title)" end' "$story")" \
                  --notes "$(jq -r '.post.caption' "$story")"; then
                  published=1
                  break
                fi
                echo "::warning::$id: GitHub refused the release (try $attempt of 3)"
                gh release delete "$id" --yes --cleanup-tag || true  # a failed create can leave a draft behind
                sleep 30
              done
              if [ -z "$published" ]; then
                echo "::error::$id was made but couldn't be published"
                failed=1
              fi
            else
              echo "::error::$id failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
      - name: Book posts
        id: book
        if: always() && steps.todo.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_URL: ${{ secrets.ZERNIO_API_URL }}
        run: python3 scripts/post.py --remade "${{ steps.todo.outputs.remake }}"
      - name: Save
        if: always() && steps.todo.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remake="${{ steps.todo.outputs.remake }}"; booked="${{ steps.book.outputs.booked }}"
          if [ -n "$remake" ]; then
            head -n 2 remake.txt | grep '^#' > /tmp/remake.txt || true
            cp /tmp/remake.txt remake.txt
          fi
          git add remake.txt; [ -f posts.json ] && git add posts.json
          msg=$(echo ${remake:+Remade: $remake.} ${booked:+Booked: $booked.})
          git diff --cached --quiet && exit 0
          git commit -qm "${msg:-Posts updated}"
          for i in 1 2 3 4; do
            git fetch -q --depth=50 origin stories && git rebase -q origin/stories && git push -q origin HEAD:stories && exit 0
            sleep 5
          done
          echo "::error::couldn't save remake.txt and posts.json"; exit 1
