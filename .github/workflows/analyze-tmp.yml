name: Analyze tmp

# Throwaway and read only: reads how the videos did from Zernio (analytics, retention curves, comments) into
# analysis/ on this branch. Never merged, posts nothing.
on:
  push:
    branches: [analysis-tmp]
    paths: [.github/workflows/analyze-tmp.yml, scripts/analyze_tmp.py, analysis-run.txt]

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read Zernio
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_API_URL: ${{ secrets.ZERNIO_API_URL }}
        run: python3 scripts/analyze_tmp.py
      - name: Save
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f analysis
          git commit -q -m "analysis data" || exit 0
          git push -q origin HEAD:analysis-tmp
